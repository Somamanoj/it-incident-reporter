<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IT Incident Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-body">
<div class="auth-card">
    <p class="brand">ENTERPRISE IT</p>
    <h2 class="mb-1">Incident Desk</h2>
    <p class="text-muted mb-4">Sign in to report or manage technical incidents.</p>
    <div id="alert" class="alert-hidden"></div>
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">Work email</label>
            <input class="form-control" type="email" name="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
    <p class="mt-3 mb-0">New employee? <a href="/register.html">Create an account</a></p>
    <hr>
    <p class="small text-muted mb-0">Demo users: admin@company.com, engineer@company.com, employee@company.com<br>
        Default password pattern is documented in README.</p>
</div>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
        event.preventDefault();
        hideAlert("alert");
        const form = new FormData(event.target);
        try {
            const data = await api.post("/api/auth/login", {
                email: form.get("email"),
                password: form.get("password")
            });
            auth.save(data);
            window.location.href = auth.homeFor(data.role);
        } catch (error) {
            showAlert("alert", error.message);
        }
    });
</script>
</body>
</html>
