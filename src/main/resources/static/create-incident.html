<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Incident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="page">
    <div class="panel">
        <h3>Report a technical incident</h3>
        <p class="text-muted">Give IT enough detail to start troubleshooting quickly.</p>
        <div id="alert" class="alert-hidden"></div>
        <form id="createForm">
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input class="form-control" name="title" required maxlength="150" placeholder="VPN disconnects every 10 minutes">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="5" required maxlength="2000"></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-select" name="category" required>
                        <option value="HARDWARE">Hardware</option>
                        <option value="SOFTWARE">Software</option>
                        <option value="NETWORK">Network</option>
                        <option value="ACCESS">Access / Account</option>
                        <option value="EMAIL">Email</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Priority</label>
                    <select class="form-select" name="priority" required>
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" type="submit">Submit incident</button>
        </form>
    </div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
    const session = auth.require(["EMPLOYEE", "ADMIN"]);
    if (session) {
        renderNav("/create-incident.html");
        document.getElementById("createForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            hideAlert("alert");
            const form = new FormData(event.target);
            try {
                const created = await api.post("/api/incidents", {
                    title: form.get("title"),
                    description: form.get("description"),
                    category: form.get("category"),
                    priority: form.get("priority")
                });
                window.location.href = "/incident-details.html?id=" + created.id;
            } catch (error) {
                showAlert("alert", error.message);
            }
        });
    }
</script>
</body>
</html>
