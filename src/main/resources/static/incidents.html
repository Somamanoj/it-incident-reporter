<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="page">
    <h2>Incident list</h2>
    <div class="panel">
        <form id="filterForm" class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label">Incident ID</label>
                <input class="form-control" name="id" type="number" min="1" placeholder="12">
            </div>
            <div class="col-md-3">
                <label class="form-label">Priority</label>
                <select class="form-select" name="priority">
                    <option value="">All</option>
                    <option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="">All</option>
                    <option>OPEN</option><option>ASSIGNED</option><option>IN_PROGRESS</option>
                    <option>RESOLVED</option><option>CLOSED</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Category</label>
                <select class="form-select" name="category">
                    <option value="">All</option>
                    <option>HARDWARE</option><option>SOFTWARE</option><option>NETWORK</option>
                    <option>ACCESS</option><option>EMAIL</option><option>OTHER</option>
                </select>
            </div>
            <div class="col-md-1">
                <button class="btn btn-primary w-100" type="submit">Filter</button>
            </div>
        </form>
        <div class="table-responsive mt-3">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>ID</th><th>Title</th><th>Category</th><th>Priority</th>
                    <th>Status</th><th>Assignee</th><th>Created</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
    const session = auth.require(["EMPLOYEE", "SUPPORT_ENGINEER", "ADMIN"]);
    if (session) {
        renderNav("/incidents.html");
        load();
        document.getElementById("filterForm").addEventListener("submit", function (event) {
            event.preventDefault();
            load();
        });
    }
    async function load() {
        const form = new FormData(document.getElementById("filterForm"));
        const params = new URLSearchParams();
        ["id", "priority", "status", "category"].forEach(function (key) {
            const value = form.get(key);
            if (value) params.set(key, value);
        });
        const qs = params.toString();
        const incidents = await api.get("/api/incidents" + (qs ? "?" + qs : ""));
        document.getElementById("rows").innerHTML = incidents.map(function (item) {
            return "<tr onclick=\"location.href='/incident-details.html?id=" + item.id + "'\" style=\"cursor:pointer\">" +
                "<td>INC-" + item.id + "</td><td>" + item.title + "</td><td>" + item.category + "</td><td>" +
                priorityBadge(item.priority) + "</td><td>" + statusBadge(item.status) + "</td><td>" +
                (item.assignee ? item.assignee.fullName : "Unassigned") + "</td><td>" + formatDate(item.createdAt) + "</td></tr>";
        }).join("") || '<tr><td colspan="7" class="text-muted">No matching incidents.</td></tr>';
    }
</script>
</body>
</html>
