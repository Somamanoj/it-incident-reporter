<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="page">
    <h2>IT support dashboard</h2>
    <p class="text-muted">Unassigned queue plus tickets assigned to you.</p>
    <div id="stats" class="stat-grid"></div>
    <div class="panel">
        <h5>Work queue</h5>
        <div class="table-responsive mt-3">
            <table class="table align-middle">
                <thead>
                <tr><th>ID</th><th>Title</th><th>Priority</th><th>Status</th><th>Assignee</th></tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
    const session = auth.require(["SUPPORT_ENGINEER"]);
    if (session) {
        renderNav("/support-dashboard.html");
        Promise.all([api.get("/api/dashboard/stats"), api.get("/api/incidents")]).then(([stats, incidents]) => {
            document.getElementById("stats").innerHTML = [
                card(stats.totalIncidents, "Visible tickets"),
                card(stats.openIncidents, "Open / assigned"),
                card(stats.inProgressIncidents, "In progress"),
                card(stats.resolvedIncidents, "Resolved"),
                card(stats.criticalIncidents, "Critical")
            ].join("");
            document.getElementById("rows").innerHTML = incidents.map(function (item) {
                return "<tr onclick=\"location.href='/incident-details.html?id=" + item.id + "'\" style=\"cursor:pointer\">" +
                    "<td>INC-" + item.id + "</td><td>" + item.title + "</td><td>" + priorityBadge(item.priority) +
                    "</td><td>" + statusBadge(item.status) + "</td><td>" +
                    (item.assignee ? item.assignee.fullName : "Unassigned") + "</td></tr>";
            }).join("") || '<tr><td colspan="5" class="text-muted">Queue is empty.</td></tr>';
        }).catch(err => alert(err.message));
    }
    function card(value, label) {
        return '<div class="stat-card"><h3>' + value + "</h3><p>" + label + "</p></div>";
    }
</script>
</body>
</html>
