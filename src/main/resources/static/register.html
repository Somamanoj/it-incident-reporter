<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | IT Incident Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-body">
<div class="auth-card">
    <p class="brand">ENTERPRISE IT</p>
    <h2 class="mb-1">Employee registration</h2>
    <p class="text-muted mb-4">Create an account to raise IT tickets.</p>
    <div id="alert" class="alert-hidden"></div>
    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">Full name</label>
            <input class="form-control" name="fullName" required maxlength="100">
        </div>
        <div class="mb-3">
            <label class="form-label">Work email</label>
            <input class="form-control" type="email" name="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" minlength="8" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Register</button>
    </form>
    <p class="mt-3 mb-0">Already registered? <a href="/index.html">Login</a></p>
</div>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
    document.getElementById("registerForm").addEventListener("submit", async function (event) {
        event.preventDefault();
        hideAlert("alert");
        const form = new FormData(event.target);
        try {
            const data = await api.post("/api/auth/register", {
                fullName: form.get("fullName"),
                email: form.get("email"),
                password: form.get("password")
            });
            auth.save(data);
            window.location.href = auth.homeFor(data.role);
        } catch (error) {
            showAlert("alert", error.message);
        }
    });
</script>
</body>
</html>
