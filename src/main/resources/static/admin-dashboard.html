<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="topbar" class="topbar"></div>
<div class="page">
    <h2>Admin dashboard</h2>
    <p class="text-muted">Organisation-wide incident health and user directory.</p>
    <div id="stats" class="stat-grid"></div>
    <div class="row">
        <div class="col-lg-7">
            <div class="panel">
                <h5>All incidents</h5>
                <div class="table-responsive mt-3">
                    <table class="table align-middle">
                        <thead><tr><th>ID</th><th>Title</th><th>Priority</th><th>Status</th></tr></thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="panel">
                <h5>Users</h5>
                <div class="table-responsive mt-3">
                    <table class="table align-middle">
                        <thead><tr><th>Name</th><th>Role</th></tr></thead>
                        <tbody id="users"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script>
    const session = auth.require(["ADMIN"]);
    if (session) {
        renderNav("/admin-dashboard.html");
        Promise.all([
            api.get("/api/dashboard/stats"),
            api.get("/api/incidents"),
            api.get("/api/admin/users")
        ]).then(([stats, incidents, users]) => {
            document.getElementById("stats").innerHTML = [
                card(stats.totalIncidents, "Total incidents"),
                card(stats.openIncidents, "Open / assigned"),
                card(stats.inProgressIncidents, "In progress"),
                card(stats.resolvedIncidents, "Resolved"),
                card(stats.criticalIncidents, "Critical")
            ].join("");
            document.getElementById("rows").innerHTML = incidents.map(function (item) {
                return "<tr onclick=\"location.href='/incident-details.html?id=" + item.id + "'\" style=\"cursor:pointer\">" +
                    "<td>INC-" + item.id + "</td><td>" + item.title + "</td><td>" + priorityBadge(item.priority) +
                    "</td><td>" + statusBadge(item.status) + "</td></tr>";
            }).join("") || '<tr><td colspan="4" class="text-muted">No incidents.</td></tr>';
            document.getElementById("users").innerHTML = users.map(function (user) {
                return "<tr><td>" + user.fullName + "<div class=\"small text-muted\">" + user.email + "</div></td><td>" +
                    user.role.replace("_", " ") + "</td></tr>";
            }).join("");
        }).catch(err => alert(err.message));
    }
    function card(value, label) {
        return '<div class="stat-card"><h3>' + value + "</h3><p>" + label + "</p></div>";
    }
</script>
</body>
</html>
