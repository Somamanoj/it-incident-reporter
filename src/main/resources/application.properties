# Default profile uses in-memory H2 so the app starts without extra setup.
# Switch to MySQL with: --spring.profiles.active=mysql
spring.application.name=enterprise-it-incident-management
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT values are read from environment variables. The fallback is for local demo only.
app.jwt.secret=${JWT_SECRET:LocalDevOnlyChangeThisSecretKeyTo32CharsMin!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.seed.admin-email=admin@company.com
app.seed.admin-password=${ADMIN_PASSWORD:ChangeMeAdmin123!}
app.seed.engineer-email=engineer@company.com
app.seed.engineer-password=${ENGINEER_PASSWORD:ChangeMeEngineer123!}
app.seed.employee-email=employee@company.com
app.seed.employee-password=${EMPLOYEE_PASSWORD:ChangeMeEmployee123!}
